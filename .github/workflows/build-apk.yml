name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Java (requis pour le build Android)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Installer Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # 4. Afficher les versions pour debug
      - name: Flutter version info
        run: flutter --version

      # 5. Récupérer les dépendances
      - name: Install dependencies
        run: flutter pub get

      # 6. Vérifier le code (optionnel, retire si tu veux aller plus vite)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      # 7. Builder l'APK release
      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      # 8. Uploader l'APK comme artefact téléchargeable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: workstream-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
